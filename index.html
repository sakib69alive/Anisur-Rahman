<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#020202" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Sakib Al Hasan</title>
<script>document.documentElement.classList.add('js');setTimeout(function(){document.documentElement.classList.add('go')},3600)</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&family=Geist:wght@300..600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#020202;            /* matches the black of the portrait */
  --ink:#ECE6DA;
  --soft:#C4BEB2;
  --mu:#9C968A;
  --dim:#7C776D;
  --line:rgba(236,230,218,.13);
  --fill:rgba(236,230,218,.05);
  --fill2:rgba(236,230,218,.09);
  --ease:cubic-bezier(.16,1,.3,1);
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden;overflow-x:clip}
a,button{font:inherit;color:inherit;text-decoration:none;touch-action:manipulation}
button{border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
svg{display:block}
svg[stroke] path,svg[stroke] circle{stroke-width:1.5}
::selection{background:rgba(236,230,218,.22)}
.noscroll{overflow:hidden}

/* smooth-scroll engine (Lenis) required css */
html.lenis,html.lenis body{height:auto}
.lenis:not(.lenis-autoToggle).lenis-stopped{overflow:clip}
.lenis.lenis-smooth iframe{pointer-events:none}

.col{position:relative;z-index:1;max-width:520px;margin:0 auto}

/* ---------- hero ---------- */
.hero{--pe:max(20%,214px);position:relative;height:100vh;height:100svh;min-height:600px;max-height:1000px;overflow:hidden}
.photo{position:absolute;z-index:1;top:0;left:0;right:0;height:calc(100% - var(--pe));will-change:transform,opacity;backface-visibility:hidden;transform:translate3d(0,0,0)}
.photo-in{position:absolute;top:0;left:0;right:0;bottom:0}
.photo-in img{display:block;width:100%;height:100%;object-fit:cover;object-position:70% 20%}
/* crisp, short fade: the photo ends in solid black (no haze) */
.hero::after{content:"";position:absolute;z-index:2;left:0;right:0;bottom:0;height:calc(var(--pe) + 90px);pointer-events:none;
  background:linear-gradient(to top,var(--bg) calc(100% - 90px),rgba(2,2,2,0))}

.top{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center}
.gb{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:rgba(10,10,10,.8);border:1px solid rgba(236,230,218,.18);
  transition:transform .6s var(--ease),background .6s var(--ease)}
.gb svg{width:20px;height:20px}
.gb:active{transform:scale(.92);background:rgba(40,39,36,.95)}

.id{position:absolute;z-index:3;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);will-change:transform,opacity}
.name{margin:0;font:300 clamp(50px,16vw,80px)/.94 var(--serif);letter-spacing:-.028em}
.ln{display:block;overflow:hidden;padding:.16em 0 .1em;margin:-.16em 0 -.1em}
.ln>span{display:block}
.vbadge{display:inline-block;width:.42em;height:.42em;margin-left:.16em;vertical-align:.12em;flex:none}
.vbadge svg{display:block;width:100%;height:100%}
.facts{margin-top:22px;padding-top:15px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 14px;font-size:13.5px;color:var(--mu)}
.facts .role{color:rgba(236,230,218,.9)}
.facts .where{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.facts .where svg{width:15px;height:15px}
.status{margin:14px 0 0;display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 15px 0 13px;border-radius:999px;white-space:nowrap;
  background:var(--fill);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--soft)}
.status i,.live i{position:relative;flex:none;width:7px;height:7px;border-radius:50%;background:#7FD99A}
.status i::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%;background:#7FD99A;animation:ping 2.4s ease-out infinite}
.status em{font-style:normal;color:var(--mu)}
@keyframes ping{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(3.2);opacity:0}}

/* ---------- about (role tabs) ---------- */
.about{padding:12vh 24px 0;padding:12svh 24px 0}
.tabs{position:relative;display:flex;gap:clamp(22px,7vw,32px);margin-bottom:26px;border-bottom:1px solid var(--line)}
.tabs button{padding:6px 0 14px;font:300 clamp(22px,6.8vw,28px)/1 var(--serif);letter-spacing:-.01em;color:var(--dim);transition:color .6s var(--ease)}
.tabs button[aria-selected=true]{color:var(--ink)}
.ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--ink);transition:transform .9s var(--ease),width .9s var(--ease)}
.panel{display:none}
.panel.on{display:block}
.stack.anim .panel.on{animation:pin .9s var(--ease) both}
@keyframes pin{from{opacity:0;transform:translate3d(var(--dx,0px),10px,0)}}
.lead{margin:0;font:300 clamp(25px,6.9vw,32px)/1.26 var(--serif);letter-spacing:-.01em;text-wrap:pretty}
.stack.dim .w{opacity:.16}

/* student: social rows */
.grp{margin-top:36px}
.lbl{margin:0 0 14px 2px;font:italic 300 19px/1.2 var(--serif);letter-spacing:-.005em;color:var(--mu)}
.rows{border:1px solid var(--line);border-radius:22px;background:var(--fill);overflow:hidden}
.row{display:flex;align-items:center;gap:15px;min-height:76px;padding:15px 18px;transition:background .6s var(--ease)}
.row+.row{border-top:1px solid var(--line)}
.row .ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--fill)}
.row .ic svg{width:20px;height:20px}
.row .tx{min-width:0}
.row b{display:block;font:400 23px/1.1 var(--serif);letter-spacing:-.01em}
.row small{display:block;margin-top:4px;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .go{margin-left:auto;flex:none;width:20px;height:20px;color:var(--mu);transition:color .6s var(--ease),transform .8s var(--ease)}
.row:active{background:var(--fill2)}

/* business: quotes + websites */
.quotes{border-top:1px solid var(--line)}
.q{margin:0;padding:24px 2px;border-bottom:1px solid var(--line)}
.q blockquote{margin:0;font:italic 300 clamp(22px,6vw,26px)/1.28 var(--serif);letter-spacing:-.005em}
.q figcaption{margin-top:11px;font-size:13px;color:var(--mu)}
.sites{}
.site{padding:20px 18px 18px;border:1px solid var(--line);border-radius:22px;background:var(--fill)}
.site-d{margin:12px 0 0;font-size:13.5px;color:var(--mu)}
.site-h{display:flex;align-items:center;gap:14px;transition:opacity .6s var(--ease)}
.site-h .tx{min-width:0}
.site-h b{display:block;font:400 24px/1.12 var(--serif);letter-spacing:-.01em}
.site-h small{display:block;margin-top:4px;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--soft)}
.site-h:active{opacity:.7}
.socs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.soc{width:100%;height:50px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line);background:var(--fill);transition:background .6s var(--ease),transform .6s var(--ease)}
button.soc.soon{color:var(--soft)}
.soc svg{width:20px;height:20px}
.soc:active{background:var(--fill2);transform:scale(.93)}

/* ---------- actions ---------- */
.act{padding:11vh 24px 0;padding:11svh 24px 0}
.panel .act{padding:0;margin-top:34px}
.save{position:relative;overflow:hidden;width:100%;height:62px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:20px;
  color:#141311;font-weight:600;font-size:15.5px;letter-spacing:.005em;
  background:linear-gradient(180deg,#F4F0E7 0%,#DAD4C7 52%,#C3BCAE 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.2),0 22px 44px -20px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.05);
  transition:transform .7s var(--ease)}
.save::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.62) 50%,transparent 62%);
  transform:translateX(var(--sheen,-110%))}
.save svg{width:20px;height:20px;position:relative;z-index:1}
.save span{position:relative;z-index:1}
.save:active{transform:scale(.985)}
.quick{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:20px;background:var(--fill);overflow:hidden}
.quick a{display:flex;flex-direction:column;align-items:center;gap:9px;padding:20px 4px 17px;font-size:12.5px;font-weight:500;transition:background .6s var(--ease)}
.quick a+a{border-left:1px solid var(--line)}
.quick svg{width:22px;height:22px}
.quick a:active{background:var(--fill2)}

@media (hover:hover){
  .row:hover{background:var(--fill2)}
  .row:hover .go{color:var(--ink);transform:translate(2px,-2px)}
  .quick a:hover,.soc:hover{background:var(--fill2)}
}

/* ---------- footer ---------- */
.foot{padding:13vh 24px calc(env(safe-area-inset-bottom,0px) + 44px);padding-top:13svh;text-align:center;color:var(--dim);font-size:12.5px}
.sig{display:inline-block;margin:0 0 6px;padding:6px 14px;font:italic 300 24px/1.2 var(--serif);color:var(--mu)}
.foot p{margin:0}

/* ---------- sheets (no blur, solid scrim) ---------- */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.86);
  opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
.ov.open{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}
.sheet{width:100%;max-width:400px;max-height:96vh;overflow:auto;margin:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);padding:28px 22px 18px;border-radius:28px;text-align:center;
  background:#101010;border:1px solid var(--line);transform:translateY(40px);transition:transform .9s var(--ease)}
.ov.open .sheet{transform:none}
.sheet h3{margin:0;font:300 30px/1.1 var(--serif);letter-spacing:-.015em}
.sheet .sub{margin:6px 0 20px;font-size:13px;color:var(--mu)}
#qr{position:relative;width:216px;height:216px;margin:0 auto 12px;border-radius:22px;overflow:hidden;background:#EFEBE1;box-shadow:0 0 0 1px var(--line),0 24px 40px -22px rgba(0,0,0,.9)}
#qr canvas{display:block;width:100%;height:100%}
.ov.open #qr canvas{animation:qin .7s var(--ease) both}
@keyframes qin{from{opacity:0;transform:scale(.94)}}
.qrfail{display:grid;place-items:center;height:100%;padding:18px;color:#3a3830;font-size:12.5px;line-height:1.5}
#qrurl{margin:0 0 12px;font-size:11.5px;letter-spacing:.03em;color:var(--dim);word-break:break-all}
.opt{width:100%;display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:8px;border-radius:16px;border:1px solid var(--line);background:var(--fill);text-align:left;font-weight:500;font-size:14.5px;transition:background .6s var(--ease)}
.opt svg{width:20px;height:20px;flex:none;color:var(--mu)}
.opt:active{background:var(--fill2)}
.cl{width:100%;padding:14px;margin-top:2px;border-radius:16px;color:var(--mu);font-weight:500;font-size:14px}
@media (min-width:640px){.ov{align-items:center}.sheet{margin:0}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:80;transform:translate(-50%,-110px);max-width:calc(100vw - 32px);padding:12px 20px;border-radius:999px;
  background:var(--ink);color:#0c0c0b;font:500 13px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:transform .8s var(--ease)}
.toast.show{transform:translate(-50%,0)}

/* ---------- one orchestrated entrance (opacity + position only, never scaled) ---------- */
.js .photo-in{opacity:0}
.js.go .photo-in{opacity:1;transition:opacity 2.2s var(--ease) .05s}
.js .ln>span{transform:translateY(112%)}
.js.go .ln>span{transform:none;transition:transform 1.7s var(--ease) .35s}
.js.go .ln:nth-child(2)>span{transition-delay:.5s}
.js .facts,.js .status{opacity:0;transform:translateY(10px)}
.js.go .facts{opacity:1;transform:none;transition:opacity 1.4s var(--ease) 1.1s,transform 1.6s var(--ease) 1.1s}
.js.go .status{opacity:1;transform:none;transition:opacity 1.4s var(--ease) 1.3s,transform 1.6s var(--ease) 1.3s}
.js .gb{opacity:0}
.js.go .gb{opacity:1;transition:opacity 1.2s var(--ease) 1.4s,transform .6s var(--ease),background .6s var(--ease)}

@media (max-width:340px){.about,.act{padding-left:18px;padding-right:18px}.id{left:18px;right:18px}}
@media (max-height:620px) and (orientation:landscape){.hero{min-height:560px}}
@media (prefers-reduced-motion:reduce){
  .js .photo-in,.js .ln>span,.js .facts,.js .status{opacity:1;transform:none}
  .js .gb{opacity:1}
  .status i::after{animation:none}
  .stack.anim .panel.on{animation:none}
  *{transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main class="col">
  <section class="hero" id="hero">
    <div class="photo" id="photo"><div class="photo-in"><img id="portrait" alt="Portrait of Sakib Al Hasan" decoding="async" /></div></div>

    <div class="top">
      <button class="gb" id="open-qr" aria-label="Show QR code"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg></button>
      <button class="gb" id="open-share" aria-label="Share profile"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg></button>
    </div>

    <div class="id" id="id">
      <h1 class="name" id="name"></h1>
      <div class="facts">
        <span class="role" id="role"></span>
        <span class="where" id="where"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span id="where-t"></span></span>
      </div>
      <p class="status" id="status"><i></i><span id="stxt"></span></p>
    </div>
  </section>

  <section class="about" id="about">
    <div class="tabs" id="tabs" role="tablist" aria-label="About"><i class="ind" id="ind"></i></div>
    <div class="stack" id="stack"></div>
  </section>

  <section class="act">
    <button class="save" id="save"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>Save to contacts</span></button>
    <nav class="quick" aria-label="Contact">
      <a id="a-call" href="#"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>Call</a>
      <a id="a-wa" href="#" target="_blank" rel="noopener noreferrer"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>WhatsApp</a>
      <a id="a-mail" href="#"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>Email</a>
    </nav>
  </section>

  <footer class="foot">
    <button class="sig" id="sig" aria-label="Back to top"></button>
    <p id="crafted"></p>
  </footer>
</main>

<div class="ov" id="qm" role="dialog" aria-modal="true" aria-labelledby="qm-t" aria-hidden="true">
  <div class="sheet">
    <h3 id="qm-t">Scan to connect</h3>
    <p class="sub">Point your camera at the code</p>
    <div id="qr"></div>
    <div id="qrurl"></div>
    <button class="cl" data-close>Close</button>
  </div>
</div>

<div class="ov" id="sm" role="dialog" aria-modal="true" aria-labelledby="sm-t" aria-hidden="true">
  <div class="sheet">
    <h3 id="sm-t">Share profile</h3>
    <p class="sub">Choose how to send it</p>
    <button class="opt" id="o-copy"></button>
    <button class="opt" id="o-send"></button>
    <button class="cl" data-close>Cancel</button>
  </div>
</div>

<script>
const CONFIG = {
  fullName: "Sakib Al Hasan",
  profession: "Student & Entrepreneur",
  location: "Bangladesh",

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const isWeb = u => /^https?:/.test(u || '');
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* ---------- identity ---------- */
document.title = CONFIG.fullName;
const parts = CONFIG.fullName.trim().split(/\s+/);
const first = parts.shift(), rest = parts.join(' ');
const nameEl = $('#name');
nameEl.setAttribute('aria-label', CONFIG.fullName);
const line = t => { const l = el('span', 'ln'); l.setAttribute('aria-hidden', 'true'); l.appendChild(el('span', '', t)); return l; };
nameEl.append(line(first)); if (rest) nameEl.append(line(rest));
/* verified tick next to the name */
{ const last = nameEl.lastElementChild.firstElementChild, vb = el('i', 'vbadge');
  vb.setAttribute('role', 'img'); vb.setAttribute('aria-label', 'Verified');
  vb.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ECE6DA" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/><path fill="none" stroke="#141311" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.4l3 3 5.8-6.2"/></svg>';
  last.appendChild(vb); }
$('#role').textContent = CONFIG.profession || '';
CONFIG.location ? ($('#where-t').textContent = CONFIG.location) : ($('#where').hidden = true);
$('#sig').textContent = CONFIG.fullName;
$('#crafted').textContent = 'Crafted in ' + (CONFIG.location || 'Earth') + ', ' + new Date().getFullYear();
$('#a-call').href = 'tel:' + CONFIG.phone;
$('#a-wa').href = 'https://wa.me/' + CONFIG.whatsapp;
$('#a-mail').href = 'mailto:' + CONFIG.email;

/* ---------- active status + live local time ---------- */
const st = $('#status');
if (CONFIG.status) {
  const tick = () => {
    let t = '';
    try { t = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', timeZone: CONFIG.timezone }).format(new Date()); } catch (e) {}
    const s = $('#stxt'); s.textContent = CONFIG.status;
    if (t) s.append(' ', el('em', '', t));
  };
  tick(); setInterval(tick, 30000);
} else st.remove();

/* ---------- toast / copy ---------- */
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
function copyText(v, msg) {
  const done = () => toast(msg);
  const fb = () => { const a = document.createElement('textarea'); a.value = v; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px'; document.body.appendChild(a); a.select(); a.setSelectionRange(0, v.length); try { document.execCommand('copy'); } catch (e) {} a.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done, fb); else fb();
}

/* ---------- tab content builders ---------- */
function buildLinks() {
  const rows = el('div', 'rows');
  CONFIG.links.forEach(l => {
    const a = el('a', 'row');
    a.href = l.url || '#';
    if (isWeb(l.url)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    a.innerHTML = `<span class="ic">${ICONS[l.icon] || ICONS.link}</span><span class="tx"><b></b><small></small></span><span class="go">${l.copy ? ICONS.copy : ICONS.arrow}</span>`;
    a.querySelector('b').textContent = l.title;
    a.querySelector('small').textContent = l.sub || '';
    if (l.copy) { a.setAttribute('role', 'button'); a.onclick = e => { e.preventDefault(); copyText(l.copy, l.title + ' username copied'); }; }
    rows.appendChild(a);
  });
  const g = el('div', 'grp'); g.append(el('p', 'lbl', 'Find me on'), rows); return g;
}
function buildQuotes() {
  if (!CONFIG.quotes || !CONFIG.quotes.length) return null;
  const box = el('div', 'quotes');
  CONFIG.quotes.forEach(q => {
    const f = el('figure', 'q');
    f.appendChild(el('blockquote', '', '\u201C' + q.text.replace(/^[\u201C"]|[\u201D"]$/g, '') + '\u201D'));
    f.appendChild(el('figcaption', '', q.by + (q.role ? ', ' + q.role : '')));
    box.appendChild(f);
  });
  const g = el('div', 'grp'); g.append(el('p', 'lbl', 'Words I keep close'), box); return g;
}
function buildSites() {
  const list = (CONFIG.websites || []).filter(s => s && s.name);
  if (!list.length) return null;
  const box = el('div', 'sites');
  list.forEach(s => {
    const site = el('div', 'site');
    const head = el(s.url ? 'a' : 'div', 'site-h');
    if (s.url) { head.href = s.url; if (isWeb(s.url)) { head.target = '_blank'; head.rel = 'noopener noreferrer'; } }
    const tx = el('span', 'tx'); tx.appendChild(el('b', '', s.name));
    let host = ''; try { host = new URL(s.url).host.replace(/^www\./, ''); } catch (e) {}
    if (host) tx.appendChild(el('small', '', host));
    head.appendChild(tx);
    if (s.status !== false) { const lv = el('span', 'live'); lv.appendChild(document.createElement('i')); lv.append(s.status || 'Live'); head.appendChild(lv); }
    site.appendChild(head);
    if (s.desc) site.appendChild(el('p', 'site-d', s.desc));
    const socs = (s.socials || []).filter(x => x && x.icon);
    if (socs.length) {
      const wrap = el('div', 'socs');
      socs.forEach(x => {
        const nm = x.label || (x.icon.charAt(0).toUpperCase() + x.icon.slice(1));
        let a;
        if (x.url) {
          a = el('a', 'soc'); a.href = x.url;
          if (isWeb(x.url)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        } else {
          a = el('button', 'soc soon'); a.type = 'button';
          a.onclick = () => toast(nm + ' link coming soon');
        }
        a.setAttribute('aria-label', s.name + ' ' + nm);
        a.innerHTML = ICONS[x.icon] || ICONS.link; wrap.appendChild(a);
      });
      site.appendChild(wrap);
    }
    box.appendChild(site);
  });
  const g = el('div', 'grp'); g.append(el('p', 'lbl', 'My venture'), box); return g;
}

/* ---------- about: role tabs ---------- */
const tabs = $('#tabs'), ind = $('#ind'), stack = $('#stack');
const act = $('.act');
const panels = CONFIG.roles.map((r, i) => {
  const pn = el('div', 'panel');
  pn.id = 'p' + i; pn.setAttribute('role', 'tabpanel'); pn.setAttribute('aria-labelledby', 't' + i);
  const lead = el('p', 'lead');
  const ws = r.text.trim().split(/\s+/).map((w, k, a) => { const s = el('span', 'w', w); lead.append(s, k < a.length - 1 ? ' ' : ''); return s; });
  pn.appendChild(lead);
  let extra = [];
  if (r.id === 'student') extra = [buildLinks()];
  if (r.id === 'business') extra = [buildQuotes(), buildSites()];
  extra.forEach(x => x && pn.appendChild(x));
  stack.appendChild(pn);
  return { pn, lead, ws, id: r.id };
});
const btns = CONFIG.roles.map((r, i) => {
  const b = el('button', '', r.label);
  b.type = 'button'; b.id = 't' + i; b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'p' + i);
  b.onclick = () => select(i, true);
  b.onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = clamp(cur + (e.key === 'ArrowRight' ? 1 : -1), 0, btns.length - 1); select(n, true); btns[n].focus(); } };
  tabs.insertBefore(b, ind);
  return b;
});
if (!reduce) stack.classList.add('dim');
let cur = 0, wEls = panels[0].ws, forceLit = false, remeasure = () => {};
const moveInd = i => { const b = btns[i]; ind.style.width = b.offsetWidth + 'px'; ind.style.transform = 'translateX(' + b.offsetLeft + 'px)'; };
function select(i, user) {
  stack.style.setProperty('--dx', (i >= cur ? 1 : -1) * 18 + 'px');
  if (user) stack.classList.add('anim');
  panels.forEach((x, j) => x.pn.classList.toggle('on', j === i));
  // contact block lives only in the student tab, right after the student text
  const P = panels[0];
  if (act.parentNode !== P.pn) P.pn.insertBefore(act, P.lead.nextSibling);
  btns.forEach((b, j) => { b.setAttribute('aria-selected', j === i); b.tabIndex = j === i ? 0 : -1; });
  wEls = panels[i].ws;
  cur = i; moveInd(i);
  requestAnimationFrame(() => remeasure());
  setTimeout(() => remeasure(), 950);   // once the tab's entrance has settled, re-sync the scroll lighting
}
select(0, false);
addEventListener('resize', () => moveInd(cur));
const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
fontsReady.then(() => moveInd(cur));

// swipe left / right on the About block to change tab (phones)
const ab = $('#about'); let sx = 0, sy = 0;
ab.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
ab.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.6) { const n = cur + (dx < 0 ? 1 : -1); if (n >= 0 && n < btns.length) select(n, true); }
}, { passive: true });

/* ---------- vCard ---------- */
const esc = s => String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
function saveContact() {
  const p = CONFIG.fullName.trim().split(/\s+/);
  const given = p[0], family = p.length > 1 ? p[p.length - 1] : '', mid = p.slice(1, -1).join(' ');
  const v = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + esc(CONFIG.fullName), `N:${esc(family)};${esc(given)};${esc(mid)};;`,
    CONFIG.profession && 'TITLE:' + esc(CONFIG.profession),
    CONFIG.phone && 'TEL;TYPE=CELL:' + CONFIG.phone,
    CONFIG.email && 'EMAIL;TYPE=INTERNET:' + CONFIG.email,
    ...CONFIG.links.filter(l => isWeb(l.url)).map(l => 'URL:' + l.url),
    ...(CONFIG.websites || []).filter(s => isWeb(s.url)).map(s => 'URL:' + s.url),
    CONFIG.vcardNote && 'NOTE:' + esc(CONFIG.vcardNote), 'END:VCARD'].filter(Boolean).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v], { type: 'text/vcard;charset=utf-8' }));
  a.download = CONFIG.fullName.replace(/\s+/g, '_') + '.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Saved to contacts');
}
$('#save').onclick = saveContact;

/* ---------- smooth scroll engine ---------- */
let lenis = null;
if (!reduce && window.Lenis) {
  // long exponential tail: a firm push keeps gliding forward, then settles (wheel / trackpad only; phones keep native momentum)
  try { lenis = new Lenis({ duration: 2.1, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), wheelMultiplier: .85, smoothWheel: true, syncTouch: false }); }
  catch (e) { lenis = null; }
}
$('#sig').onclick = () => { lenis ? lenis.scrollTo(0, { duration: 2.4 }) : scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); };

/* ---------- sheets ---------- */
let lastFocus = null;
function openM(id) {
  const m = $(id); lastFocus = document.activeElement;
  m.classList.add('open'); m.setAttribute('aria-hidden', 'false');
  root.classList.add('noscroll'); lenis && lenis.stop();
  setTimeout(() => { const b = m.querySelector('button'); b && b.focus({ preventScroll: true }); }, 60);
}
function closeM(m) {
  m.classList.remove('open'); m.setAttribute('aria-hidden', 'true');
  root.classList.remove('noscroll'); lenis && lenis.start();
  lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}
document.querySelectorAll('.ov').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) closeM(m); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.ov.open').forEach(closeM); });

$('#open-qr').onclick = () => { buildQR(); openM('#qm'); };
$('#open-share').onclick = () => openM('#sm');
$('#o-copy').innerHTML = ICONS.copy + '<span>Copy profile link</span>';
$('#o-send').innerHTML = ICONS.send + '<span>Share via apps</span>';
$('#o-copy').onclick = () => { copyText(location.href, 'Profile link copied'); closeM($('#sm')); };
$('#o-send').onclick = () => {
  closeM($('#sm'));
  navigator.share ? navigator.share({ title: CONFIG.fullName + ' | Digital Profile', url: location.href }).catch(() => {}) : copyText(location.href, 'Profile link copied');
};

/* ---------- custom QR: rounded dots, styled corners, initials badge ---------- */
let qrFor = '';
function buildQR() {
  const url = CONFIG.qrUrl || location.href.split('#')[0];
  const box = $('#qr'), label = $('#qrurl');
  label.textContent = /^https?:$/.test(location.protocol) || CONFIG.qrUrl
    ? url.replace(/^https?:\/\//, '').replace(/\/$/, '')
    : 'Preview only. QR will use your live domain once deployed.';
  if (url === qrFor && box.firstChild) return;
  if (!window.QRCode) {
    box.innerHTML = '<div class="qrfail">Loading QR...</div>';
    if (!buildQR.l) {
      buildQR.l = 1;
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
      sc.onload = () => { qrFor = ''; buildQR(); };
      sc.onerror = () => { box.innerHTML = '<div class="qrfail">QR could not load. Use Share &gt; Copy link.</div>'; };
      document.head.appendChild(sc);
    }
    return;
  }
  let m;
  try { const t = document.createElement('div'); m = new QRCode(t, { text: url, width: 8, height: 8, correctLevel: QRCode.CorrectLevel.H })._oQRCode; } catch (e) { m = null; }
  if (!m) { box.innerHTML = '<div class="qrfail">Link too long for QR.</div>'; return; }
  const N = m.getModuleCount(), Q = 4, T = N + Q * 2, S = 216, dpr = Math.min(3, window.devicePixelRatio || 2);
  const cv = document.createElement('canvas'); cv.width = cv.height = Math.round(S * dpr);
  const c = cv.getContext('2d'), u = cv.width / T, INK = '#0B0B0A', BG = '#EFEBE1';
  c.fillStyle = BG; c.fillRect(0, 0, cv.width, cv.height);
  const rr = (x, y, w, h, r) => { x *= u; y *= u; w *= u; h *= u; r *= u; c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  const inFinder = (r, k) => (r < 7 && k < 7) || (r < 7 && k >= N - 7) || (r >= N - 7 && k < 7);
  const mid = (N - 1) / 2, R = Math.max(3, Math.round(N * .115));
  c.fillStyle = INK;
  for (let r = 0; r < N; r++) for (let k = 0; k < N; k++) {
    if (!m.isDark(r, k) || inFinder(r, k)) continue;
    if (Math.hypot(r - mid, k - mid) < R + 1.2) continue;
    c.beginPath(); c.arc((k + Q + .5) * u, (r + Q + .5) * u, u * .47, 0, 6.2832); c.fill();
  }
  [[0, 0], [N - 7, 0], [0, N - 7]].forEach(([r, k]) => {
    const x = k + Q, y = r + Q;
    c.fillStyle = INK; rr(x, y, 7, 7, 2.3); c.fill();
    c.fillStyle = BG; rr(x + 1, y + 1, 5, 5, 1.5); c.fill();
    c.fillStyle = INK; rr(x + 2, y + 2, 3, 3, 1); c.fill();
  });
  const cx = (mid + Q + .5) * u, rad = R * u * .95;
  c.fillStyle = BG; c.beginPath(); c.arc(cx, cx, rad + u * .7, 0, 6.2832); c.fill();
  c.fillStyle = INK; c.beginPath(); c.arc(cx, cx, rad, 0, 6.2832); c.fill();
  const ini = CONFIG.fullName.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  c.fillStyle = BG; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '400 ' + (rad * .95) + 'px "Newsreader","Iowan Old Style",Georgia,serif'; c.fillText(ini, cx, cx + rad * .06);
  box.innerHTML = ''; box.appendChild(cv); qrFor = url;
}

/* ---------- portrait + entrance ---------- */
const img = $('#portrait');
let usedFallback = false;
img.onerror = () => { if (!usedFallback) { usedFallback = true; img.src = PHOTO; } };
img.src = CONFIG.photo || PHOTO;
const wait = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
const imgReady = img.decode ? img.decode().catch(() => {}) : new Promise(r => { img.onload = r; });
Promise.all([wait(fontsReady, 1400), wait(imgReady, 2200)]).then(() => requestAnimationFrame(() => root.classList.add('go')));

/* ---------- scroll-linked motion (weighted, lagging) ---------- */
if (!reduce) {
  const photo = $('#photo'), idEl = $('#id'), save = $('#save');
  let vh = innerHeight, leadTop = 0, leadH = 0, saveY = 0;
  let last = -1, lastY = -1, lastP = -1, rz, y0 = scrollY;
  const measure = () => {
    vh = innerHeight; const y = scrollY;
    const r = panels[cur].lead.getBoundingClientRect(); leadTop = r.top + y; leadH = r.height;
    const s = save.getBoundingClientRect(); saveY = s.top + y + s.height / 2;
    last = -1; lastP = -1;
  };
  remeasure = measure;

  function render() {
    const y = Math.max(0, y0);
    // photo and name follow the finger exactly (real scroll position, sub-pixel), so nothing drifts or steps
    const ys = Math.max(0, scrollY);
    photo.style.transform = `translate3d(0,${(ys * .34).toFixed(2)}px,0)`;
    photo.style.opacity = (1 - clamp(ys / (vh * .85))).toFixed(3);
    idEl.style.transform = `translate3d(0,${(ys * .2).toFixed(2)}px,0)`;
    idEl.style.opacity = (1 - clamp(ys / (vh * .5))).toFixed(3);
    // words light up as the paragraph travels through the screen
    if (!forceLit) {
      const top = leadTop - y0;
      const p = clamp((vh * .9 - top) / ((vh * .9 - vh * .4) + leadH));
      if (p !== lastP) {
        lastP = p; const n = wEls.length, k = p * (n + 4);
        for (let i = 0; i < n; i++) wEls[i].style.opacity = (.16 + .84 * clamp(k - i)).toFixed(3);
      }
    }
    // a slow highlight drifts across the steel button as it passes
    const t = (saveY - y0) / vh;
    save.style.setProperty('--sheen', ((t - .5) * 240).toFixed(1) + '%');
  }

  const ease = lenis ? .16 : .09;
  function loop(time) {
    if (lenis) lenis.raf(time);
    const y = scrollY;
    y0 += (y - y0) * ease;
    if (Math.abs(y - y0) < .08) y0 = y;
    if (y0 !== last || y !== lastY) { last = y0; lastY = y; render(); }
    requestAnimationFrame(loop);
  }

  measure(); render();
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(measure, 120); });
  addEventListener('orientationchange', () => setTimeout(measure, 300));
  addEventListener('load', measure);
  fontsReady.then(measure);
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
